[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:relay-tavily]
command=python3 /opt/key-proxy/key_rotate_proxy.py tavily
priority=1
autorestart=true
startsecs=2

[program:relay-firecrawl]
command=python3 /opt/key-proxy/key_rotate_proxy.py firecrawl
priority=1
autorestart=true
startsecs=2

[program:relay-context7]
command=python3 /opt/key-proxy/key_rotate_proxy.py context7
priority=1
autorestart=true
startsecs=2

[program:tavily]
command=sh -c "node /app/_tavily_patch.js; exec node /app/mcp_http_bridge.js 4009 node /usr/lib/node_modules/tavily-mcp/build/index.js"
priority=5
autorestart=true
startsecs=3

[program:firecrawl]
command=node /app/mcp_http_bridge.js 4008 node /usr/lib/node_modules/firecrawl-mcp/dist/index.js
priority=5
autorestart=true
startsecs=3

[program:context7]
command=node /app/mcp_http_bridge.js 4023 npx -y @upstash/context7-mcp@4.7.3
priority=5
autorestart=true
startsecs=5

[program:fatsearch]
command=node /app/mcp_http_bridge.js 4027 npx -y fatsearch@0.2.5 mcp
priority=5
autorestart=true
startsecs=5

[program:playwright]
command=sh -c "exec npx -y @playwright/mcp@0.0.86 --port 4002 --host 127.0.0.1 --allowed-hosts * --headless --no-sandbox --executable-path /usr/local/bin/chromium --allow-unrestricted-file-access --file-paths absolute"
priority=5
autorestart=true
startsecs=8

[program:chrome]
command=sh -c "exec node /app/mcp_http_bridge.js 4003 chrome-devtools-mcp --headless --executablePath /usr/local/bin/chromium --chromeArg=--no-sandbox --workspace=/work"
priority=5
autorestart=true
startsecs=5

[program:stealth]
command=/opt/stealth-venv/bin/python /opt/stealth-browser-mcp/src/server.py --transport http --host 127.0.0.1 --port 4007 --minimal
priority=5
autorestart=true
startsecs=6

[program:scrapling]
command=/opt/scrapling-venv/bin/scrapling mcp --http --host 127.0.0.1 --port 4033 --allowed-host 127.0.0.1:4033
priority=5
autorestart=true
startsecs=6

[program:web-stack]
command=python3 /opt/wait_web_stack.py
priority=10
autorestart=true
